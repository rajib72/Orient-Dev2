<template>
    <lightning-quick-action-panel header="Create Activity">

        <template if:true={isLoading}>
            <div class="spinnerOverlay">
                <lightning-spinner alternative-text="Saving..." size="medium"></lightning-spinner>
            </div>
        </template>

        <div class="mainWrapper">

            <div class="headerCard">
                <div class="iconCircle">
                    <lightning-icon icon-name="standard:event" size="small"></lightning-icon>
                </div>

                <div>
                    <h2>Create Form Activity</h2>
                    <p>Fill activity details, select stores, locations, executives and target dates.</p>
                </div>
            </div>

            <div class="formCard">

                <div class="sectionTitle">
                    Activity Information
                </div>

                <div class="slds-grid slds-wrap slds-gutters">

                    <div class="slds-col slds-size_1-of-1 inputGap">
                        <lightning-input
                            type="text"
                            label="Activity Name"
                            value={activityName}
                            onchange={handleActivityNameChange}
                            required>
                        </lightning-input>
                    </div>

                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 inputGap">
                        <lightning-input
                            type="date"
                            label="Activity Start Date"
                            value={activityDate}
                            onchange={handleActivityDateChange}
                            required>
                        </lightning-input>
                    </div>

                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 inputGap">
                        <lightning-input
                            type="date"
                            label="Activity End Date"
                            data-id="activityEndDate"
                            value={activityEndDate}
                            onchange={handleActivityEndDateChange}
                            required>
                        </lightning-input>
                    </div>

                    <div class="slds-col slds-size_1-of-1 inputGap">
                        <div class="storeMultiWrapper">
                            <label class="customLabel">
                                <abbr class="slds-required" title="required">*</abbr>
                                Assigned Stores
                            </label>

                            <div class="slds-combobox_container">
                                <div class={storeDropdownClass}>

                                    <div
                                        class="slds-combobox__form-element slds-input-has-icon slds-input-has-icon_right"
                                        onclick={toggleStoreDropdown}>

                                        <div class="multiSelectBox">
                                            <span class={selectedStoreTextClass}>
                                                {selectedStoreDisplay}
                                            </span>

                                            <lightning-icon
                                                icon-name="utility:chevrondown"
                                                size="xx-small"
                                                class="dropdownIcon">
                                            </lightning-icon>
                                        </div>
                                    </div>

                                    <template if:true={isStoreDropdownOpen}>
                                        <div class="slds-dropdown slds-dropdown_fluid storeDropdown">
                                            <ul class="slds-listbox slds-listbox_vertical" role="presentation">

                                                <template for:each={storeOptions} for:item="store">
                                                    <li key={store.value} role="presentation">
                                                        <div
                                                            class={store.optionClass}
                                                            data-id={store.value}
                                                            onclick={handleStoreOptionClick}>

                                                            <div class="storeCheck">
                                                                <template if:true={store.selected}>
                                                                    <lightning-icon
                                                                        icon-name="utility:check"
                                                                        size="xx-small"
                                                                        class="storeCheckIcon">
                                                                    </lightning-icon>
                                                                </template>
                                                            </div>

                                                            <span class="storeOptionLabel">
                                                                {store.label}
                                                            </span>
                                                        </div>
                                                    </li>
                                                </template>

                                            </ul>
                                        </div>
                                    </template>

                                </div>
                            </div>

                            <template if:true={storeError}>
                                <div class="storeError">
                                    {storeError}
                                </div>
                            </template>

                            <template if:true={hasSelectedStores}>
                                <div class="selectedStorePills">
                                    <template for:each={selectedStorePills} for:item="store">
                                        <span key={store.value} class="storePill">
                                            {store.label}
                                            <button
                                                type="button"
                                                class="pillClose"
                                                data-id={store.value}
                                                onclick={handleRemoveStore}>
                                                ×
                                            </button>
                                        </span>
                                    </template>
                                </div>
                            </template>
                        </div>
                    </div>

                </div>

                <template if:true={hasSelectedStores}>
                    <div class="sectionTitle secondSection">
                        Assign Sales Executives
                    </div>

                    <div class="executiveBox">

                        <div class="executiveHeader">
                            <div>
                                <h3>Select Sales Executives</h3>
                                <p>Enter location store-wise, then select executives and multiple target dates.</p>
                            </div>

                            <div class="selectedBadge">
                                {selectedCount} Selected
                            </div>
                        </div>

                        <template if:true={hasSalesExecutives}>
                            <template for:each={storeExecutiveGroups} for:item="group">
                                <div key={group.storeId} class="storeExecutiveGroup">

                                    <div class="storeGroupHeader">
                                        <div>
                                            <h4>{group.storeName}</h4>
                                            <p>{group.selectedCount} of {group.totalCount} selected</p>
                                        </div>
                                    </div>

                                    <div class="storeLocationBox">
                                        <lightning-input
                                            type="text"
                                            label="Activity Location"
                                            data-store-id={group.storeId}
                                            value={group.activityLocation}
                                            onchange={handleStoreActivityLocationChange}
                                            required>
                                        </lightning-input>
                                    </div>

                                    <template if:true={group.hasExecutives}>
                                        <div class="executiveList">
                                            <template for:each={group.executives} for:item="exec">
                                                <div
                                                    key={exec.value}
                                                    class={exec.cardClass}
                                                    data-id={exec.value}
                                                    onclick={handleExecutiveCardClick}>

                                                    <div class="avatarCircle">
                                                        {exec.initial}
                                                    </div>

                                                    <div class="executiveInfo">
                                                        <div class="executiveName">
                                                            {exec.label}
                                                        </div>
                                                        <div class="executiveSubText">
                                                            Sales Executive
                                                        </div>
                                                    </div>

                                                    <div class="checkArea">
                                                        <template if:true={exec.selected}>
                                                            <lightning-icon
                                                                icon-name="utility:check"
                                                                size="x-small"
                                                                class="checkIcon">
                                                            </lightning-icon>
                                                        </template>
                                                    </div>

                                                    <template if:true={exec.selected}>
                                                        <div class="assignmentDateBox" onclick={stopEvent}>

                                                            <div class="dateMultiWrapper">
                                                                <label class="customLabel">
                                                                    <abbr class="slds-required" title="required">*</abbr>
                                                                    Target Dates
                                                                </label>

                                                                <div
                                                                    class="dateMultiSelectBox"
                                                                    data-id={exec.value}
                                                                    onclick={toggleExecutiveDateDropdown}>

                                                                    <span class={exec.dateTextClass}>
                                                                        {exec.assignedDateDisplay}
                                                                    </span>

                                                                    <lightning-icon
                                                                        icon-name="utility:chevrondown"
                                                                        size="xx-small"
                                                                        class="dateDropdownIcon">
                                                                    </lightning-icon>
                                                                </div>

                                                                <template if:true={exec.isDateDropdownOpen}>
                                                                    <div class="dateDropdownPanel">
                                                                        <template for:each={exec.dateOptions} for:item="dateOpt">
                                                                            <div
                                                                                key={dateOpt.value}
                                                                                class={dateOpt.optionClass}
                                                                                data-exec-id={exec.value}
                                                                                data-date={dateOpt.value}
                                                                                onclick={handleExecutiveDateOptionClick}>

                                                                                <div class="dateCheckBox">
                                                                                    <template if:true={dateOpt.selected}>
                                                                                        <lightning-icon
                                                                                            icon-name="utility:check"
                                                                                            size="xx-small"
                                                                                            class="dateCheckIcon">
                                                                                        </lightning-icon>
                                                                                    </template>
                                                                                </div>

                                                                                <span>{dateOpt.label}</span>
                                                                            </div>
                                                                        </template>
                                                                    </div>
                                                                </template>

                                                                <template if:true={exec.hasAssignedDates}>
                                                                    <div class="selectedDatePills">
                                                                        <template for:each={exec.selectedDatePills} for:item="datePill">
                                                                            <span key={datePill.value} class="datePill">
                                                                                {datePill.label}
                                                                                <button
                                                                                    type="button"
                                                                                    class="datePillClose"
                                                                                    data-exec-id={exec.value}
                                                                                    data-date={datePill.value}
                                                                                    onclick={handleRemoveExecutiveDate}>
                                                                                    ×
                                                                                </button>
                                                                            </span>
                                                                        </template>
                                                                    </div>
                                                                </template>
                                                            </div>

                                                        </div>
                                                    </template>

                                                </div>
                                            </template>
                                        </div>
                                    </template>

                                    <template if:false={group.hasExecutives}>
                                        <div class="emptyMsg">
                                            No Sales Executives found for this Store.
                                        </div>
                                    </template>

                                </div>
                            </template>
                        </template>

                        <template if:false={hasSalesExecutives}>
                            <div class="emptyMsg">
                                No Sales Executives found for selected Stores.
                            </div>
                        </template>

                    </div>
                </template>

                <div class="noteBox">
                    <lightning-icon icon-name="utility:info" size="x-small"></lightning-icon>
                    <span>
                        For every selected store, one Form Activity record will be created. Multiple selected target dates will be saved under assigned person date records.
                    </span>
                </div>

            </div>

            <div class="footerBtn">
                <lightning-button
                    label="Cancel"
                    variant="neutral"
                    onclick={handleCancel}>
                </lightning-button>

                <lightning-button
                    class="slds-m-left_small"
                    label="Save Activity"
                    variant="brand"
                    onclick={handleSave}
                    disabled={isLoading}>
                </lightning-button>
            </div>

        </div>

    </lightning-quick-action-panel>
</template>
