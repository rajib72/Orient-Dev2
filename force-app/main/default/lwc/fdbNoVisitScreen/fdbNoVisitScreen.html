<template>
    <c-fdb-screen onnavclick={handleNav} onhelpclick={handleHelp}>
            <div class="ojn__inner">

                <!-- Two groups so landscape can set them side by side. In
                     portrait both are display:contents and nothing moves. -->
                <div class="oj-col oj-col_lead">

                <!-- Customer located -->
                <div class="ojnv__verified">
                    <span class="ojnv__verified-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
                             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M6 12.4l4 4 8-8.4"></path>
                        </svg>
                    </span>
                    <div class="ojnv__verified-text">
                        <h2>Customer Verified</h2>
                        <p>Your customer profile has been located successfully.</p>
                    </div>
                </div>

                <div class="oj-orn oj-orn_sm">
                    <span class="oj-orn__line"></span>
                    <span class="oj-orn__diamond"></span>
                    <span class="oj-orn__line"></span>
                </div>

                <!-- Headline -->
                <div class="ojnv__head">
                    <span class="ojnv__warn-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"
                             stroke-linecap="round" aria-hidden="true">
                            <path d="M12 6.5v7.2"></path>
                            <path d="M12 17.6v.1"></path>
                        </svg>
                    </span>
                    <h1 class="ojnv__title">Today&rsquo;s Showroom<br />Visit Not Found</h1>
                </div>

                <div class="oj-orn oj-orn_sm">
                    <span class="oj-orn__line"></span>
                    <span class="oj-orn__diamond"></span>
                    <span class="oj-orn__line"></span>
                </div>

                <p class="ojn__text">
                    However, we could not find a showroom visit
                    for <strong>today</strong> associated with your profile.
                </p>

                <!-- Why feedback is unavailable -->
                <div class="ojnv__note">
                    <span class="ojnv__note-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <rect x="3.2" y="4.8" width="17.6" height="15.4" rx="2.4"></rect>
                            <path d="M3.2 9.6h17.6M8 3.2v3.2M16 3.2v3.2"></path>
                            <circle cx="12" cy="13.4" r="1.9"></circle>
                            <path d="M8.6 18.2a3.7 3.7 0 0 1 6.8 0"></path>
                        </svg>
                    </span>
                    <p>Feedback can be submitted only after your showroom visit has been registered in our system.</p>
                </div>

                </div><!-- /oj-col_lead -->

                <div class="oj-col oj-col_act">

                <!-- Showroom team -->
                <div class="ojnv__row">
                    <span class="ojnv__row-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <circle cx="12" cy="8.4" r="3"></circle>
                            <circle cx="5" cy="10.2" r="2.3"></circle>
                            <circle cx="19" cy="10.2" r="2.3"></circle>
                            <path d="M7.2 18.4a4.9 4.9 0 0 1 9.6 0"></path>
                            <path d="M1.8 18.4a3.5 3.5 0 0 1 3.9-3M22.2 18.4a3.5 3.5 0 0 0-3.9-3"></path>
                        </svg>
                    </span>
                    <p>
                        If you are currently visiting our showroom,
                        please contact our <strong>Showroom Team</strong> for assistance.
                    </p>
                </div>

                <span class="ojn__rule"></span>

                <!-- Customer care -->
                <div class="ojnv__row">
                    <span class="ojnv__row-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M4.5 14.2v-2.1a7.5 7.5 0 0 1 15 0v2.1"></path>
                            <rect x="2.6" y="13.6" width="4.2" height="6.6" rx="1.7"></rect>
                            <rect x="17.2" y="13.6" width="4.2" height="6.6" rx="1.7"></rect>
                        </svg>
                    </span>
                    <p>
                        For further support, please contact
                        our <strong>Customer Care</strong>:
                    </p>
                </div>

                <div class="ojn__contact ojnv__contact">
                    <template for:each={supportNumbers} for:item="num">
                        <a key={num.display} class="ojn__contact-row" href={num.href}>
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
                                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.3 1.8.6 2.7a2 2 0 0 1-.5 2.1L8.1 9.6a16 16 0 0 0 6 6l1.1-1.1a2 2 0 0 1 2.1-.5c.9.3 1.8.5 2.7.6a2 2 0 0 1 1.7 2z"></path>
                            </svg>
                            <span>{num.display}</span>
                        </a>
                    </template>
                </div>

                <span class="ojn__rule"></span>

                <p class="ojnv__cta-hint">
                    You can still review and update your profile details.
                </p>

                <button class="ojn__cta" type="button" onclick={handleUpdateProfileFromNoVisit}>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M12.5 4.5H5.6A1.6 1.6 0 0 0 4 6.1v12.3A1.6 1.6 0 0 0 5.6 20h12.3a1.6 1.6 0 0 0 1.6-1.6v-6.9"></path>
                        <path d="M17.6 3.4a2.1 2.1 0 0 1 3 3L12 15l-4 1 1-4 8.6-8.6z"></path>
                    </svg>
                    <span>Update My Profile</span>
                </button>

                <button class="ojn__cta ojnv__cta_ghost" type="button" onclick={handleSearchAgain}>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M20.5 12a8.5 8.5 0 1 1-2.6-6.1"></path>
                        <path d="M19.4 3.2v5.2h-5.2"></path>
                    </svg>
                    <span>Search Again</span>
                </button>

                </div><!-- /oj-col_act -->

            </div>
    </c-fdb-screen>
</template>
