<template>
    <div class="slds-p-around_medium slds-box slds-theme_default">

        <!-- ================= CUSTOMER SEARCH ================= -->
        <lightning-input
            label="Customer Phone Number"
            placeholder="Enter 10-digit phone number"
            value={phone}
            onchange={handlePhoneChange}>
        </lightning-input>

        <!-- EXISTING CUSTOMER -->
        <template if:true={isCustomerFound}>
            <div class="slds-box slds-theme_shade slds-m-top_small">
                <p><strong>Customer Name:</strong> {customer.name}</p>
                <p><strong>Customer Code:</strong> {customer.code}</p>
            </div>
        </template>

        <!-- NEW CUSTOMER -->
        <template if:true={isNewCustomer}>
            <lightning-input
                class="slds-m-top_small"
                label="Customer Name"
                placeholder="Enter customer name"
                value={customerName}
                onchange={handleNameChange}>
            </lightning-input>
        </template>

        <!-- ================= SCHEME SELECTION ================= -->
        <template if:true={showSchemeSection}>
            <lightning-combobox
                class="slds-m-top_medium"
                label="Scheme Type"
                placeholder="Select Scheme"
                options={schemeOptions}
                onchange={handleSchemeChange}>
            </lightning-combobox>
        </template>

        <!-- ================= SCHEME DETAILS ================= -->
        <template if:true={showSchemeDetails}>
            <div class="slds-box slds-theme_shade slds-m-top_medium">

                <div class="slds-grid slds-wrap slds-gutters">
                    <div class="slds-col slds-size_1-of-2">
                        <p><strong>Scheme Duration:</strong> {scheme.duration} months</p>
                    </div>
                    <div class="slds-col slds-size_1-of-2">
                        <p><strong>Total Amount:</strong> ₹ {scheme.total}</p>
                    </div>

                    <div class="slds-col slds-size_1-of-2 slds-m-top_small">
                        <p><strong>Monthly Installment:</strong> ₹ {scheme.installment}</p>
                    </div>
                    <div class="slds-col slds-size_1-of-2 slds-m-top_small">
                        <p class="slds-text-color_success">
                            <strong>First Installment Payable:</strong> ₹ {scheme.firstPayment}
                        </p>
                    </div>
                </div>
            </div>
        </template>

        <!-- ================= SAVE ================= -->
        <template if:true={showSave}>
            <div class="slds-m-top_medium slds-text-align_right">
                <lightning-button
                    variant="brand"
                    label="Save Scheme Enrollment"
                    onclick={handleSave}>
                </lightning-button>
                <lightning-button
    label="Cancel"
    variant="neutral"
    class="slds-m-left_small"
    onclick={handleCancel}>
</lightning-button>

            </div>
        </template>

    </div>
</template>
