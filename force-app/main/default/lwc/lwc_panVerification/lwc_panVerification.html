<template>
    <lightning-card>
        <div class="main-container">

            <template if:true={isInitialLoading}>
                <div class="spinner-area">
                    <lightning-spinner alternative-text="Loading..." size="medium"></lightning-spinner>
                </div>
            </template>

            <template if:false={isInitialLoading}>
                <template if:false={canShowComponent}>
                    <div class="error-box">
                        <lightning-icon icon-name="utility:error" size="medium" variant="inverse" class="error-icon">
                        </lightning-icon>
                        <div>
                            <h2>Required Details Missing</h2>
                            <p>{initialValidationMessage}</p>
                        </div>
                    </div>
                </template>

                <template if:true={canShowComponent}>
                    <div class="header-section">
                        <div class="header-left">
                            <lightning-icon icon-name="standard:account" size="medium" class="header-icon">
                            </lightning-icon>
                            <h1>PAN Verification</h1>
                        </div>

                        <lightning-button-icon icon-name="utility:refresh" alternative-text="Refresh" title="Refresh"
                            onclick={handleRefresh} disabled={disableRefreshButton} variant="border-filled" size="small"
                            class="refresh-icon-btn">
                        </lightning-button-icon>
                    </div>

                    <div class="search-section">
                        <div class="input-wrapper">
                            <label><span class="required">*</span> PAN Number</label>
                            <lightning-input variant="label-hidden" value={panNumber} onchange={handlePanChange}
                                placeholder="Enter PAN Number">
                            </lightning-input>
                        </div>

                        <button class="verify-btn" onclick={handleVerifyPan} disabled={isLoading}>
                            <lightning-icon icon-name="utility:search" size="x-small" variant="inverse"></lightning-icon>
                            <span>Verify PAN</span>
                        </button>
                    </div>

                    <template if:true={isLoading}>
                        <div class="spinner-area">
                            <lightning-spinner alternative-text="Verifying PAN..." size="medium"></lightning-spinner>
                        </div>
                    </template>

                    <template if:true={isRefreshing}>
                        <div class="spinner-area">
                            <lightning-spinner alternative-text="Refreshing..." size="medium"></lightning-spinner>
                        </div>
                    </template>

                    <template if:true={showSuccess}>
                        <div class="success-box">
                            <lightning-icon icon-name="utility:success" size="medium" variant="inverse"
                                class="success-icon"></lightning-icon>
                            <div>
                                <h2>Verification Successful</h2>
                                <p>PAN details fetched successfully from Surepass.</p>
                            </div>
                        </div>
                    </template>

                    <template if:true={showError}>
                        <div class="error-box">
                            <lightning-icon icon-name="utility:error" size="medium" variant="inverse"
                                class="error-icon"></lightning-icon>
                            <div>
                                <h2>Verification Failed</h2>
                                <p>{errorMessage}</p>
                            </div>
                        </div>
                    </template>

                    <template if:true={panDetails}>
                        <div class="details-card">
                            <div class="details-header">
                                <lightning-icon icon-name="standard:contact" size="medium"></lightning-icon>
                                <h2>PAN Details</h2>
                            </div>

                            <div class="details-grid">
                                <div class="detail-row">
                                    <div class="label">PAN Number</div>
                                    <div class="value">{panDetails.pan_number}</div>
                                </div>

                                <div class="detail-row">
                                    <div class="label">Full Name</div>
                                    <div class="value">{panDetails.full_name}</div>
                                </div>

                                <div class="detail-row">
                                    <div class="label">DOB</div>
                                    <div class="value">{formattedPanDob}</div>
                                </div>

                                <div class="detail-row">
                                    <div class="label">Gender</div>
                                    <div class="value">{panDetails.gender}</div>
                                </div>

                                <div class="detail-row">
                                    <div class="label">PAN Status</div>
                                    <div class="value">
                                        <span class="status-pill">{panDetails.status}</span>
                                    </div>
                                </div>

                                <div class="detail-row">
                                    <div class="label">Category</div>
                                    <div class="value">{panDetails.category}</div>
                                </div>

                                <div class="detail-row">
                                    <div class="label">Masked Aadhaar</div>
                                    <div class="value">{panDetails.masked_aadhaar}</div>
                                </div>

                                <div class="detail-row">
                                    <div class="label">Aadhaar Linked</div>
                                    <div class="value">{aadhaarLinkedText}</div>
                                </div>
                            </div>

                            <div class="button-area">
                                <button class="update-btn" onclick={handleUpdatePan} disabled={isLoading}>
                                    <lightning-icon icon-name="utility:save" size="x-small" variant="inverse"></lightning-icon>
                                    <span>Update PAN</span>
                                </button>
                            </div>
                        </div>
                    </template>
                </template>
            </template>
        </div>

        <!-- 1. Mismatch Modal -->
        <template if:true={showMismatchModal}>
            <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container custom-modal-width">
                    <header class="slds-modal__header custom-header-left">
                        <button
                            class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                            title="Close"
                            onclick={closeAllModals}>
                            <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse" size="small"></lightning-icon>
                        </button>

                        <div class="header-content">
                            <lightning-icon icon-name="utility:error" size="small" variant="error"></lightning-icon>
                            <h2 class="slds-text-heading_medium header-title">PAN Details Mismatch</h2>
                        </div>
                    </header>

                    <div class="slds-modal__content slds-p-around_large slds-theme_default">
                        <p class="slds-m-bottom_medium modal-text">
                            The verified PAN details do not match the details currently available in the account.<br/>
                            Please review the differences below before proceeding.
                        </p>

                        <table
                            class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_col-bordered custom-table">
                            <thead>
                                <tr class="slds-line-height_reset">
                                    <th scope="col">
                                        <div class="slds-truncate" title="Particulars">Particulars</div>
                                    </th>
                                    <th scope="col">
                                        <div class="slds-truncate" title="Current Account Details">Current Account
                                            Details</div>
                                    </th>
                                    <th scope="col">
                                        <div class="slds-truncate" title="Verified PAN Details">Verified PAN Details
                                        </div>
                                    </th>
                                </tr>
                            </thead>

                            <tbody>
                                <template if:true={isPanMismatch}>
                                    <tr>
                                        <td><strong>PAN Number</strong></td>
                                        <td>{accountPan}</td>
                                        <td>{panDetails.pan_number}</td>
                                    </tr>
                                </template>

                                <template if:true={isNameMismatch}>
                                    <tr>
                                        <td><strong>Full Name</strong></td>
                                        <td>{accountName}</td>
                                        <td>{panDetails.full_name}</td>
                                    </tr>
                                </template>

                                <template if:true={isDobMismatch}>
                                    <tr>
                                        <td><strong>Date of Birth</strong></td>
                                        <td>{formattedAccountDob}</td>
                                        <td>{formattedPanDob}</td>
                                    </tr>
                                </template>

                                <template if:true={isGenderMismatch}>
                                    <tr>
                                        <td><strong>Gender</strong></td>
                                        <td>{accountGender}</td>
                                        <td>{panDetails.gender}</td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>

                    <footer class="slds-modal__footer custom-footer-right">
                        <button class="slds-button slds-button_neutral custom-btn" onclick={closeAllModals}>Cancel</button>
                        <button class="slds-button slds-button_brand custom-btn" onclick={handleProceedUpdate}>Proceed & Update</button>
                    </footer>
                </div>
            </section>

            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>

        <!-- 2. Confirm Update Modal -->
        <template if:true={showConfirmModal}>
            <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container custom-modal-width">
                    <div class="slds-modal__content slds-p-around_large slds-text-align_center custom-rounded-top">
                        <button class="slds-button slds-button_icon custom-corner-close" title="Close" onclick={closeAllModals}>
                            <lightning-icon icon-name="utility:close" size="small"></lightning-icon>
                        </button>

                        <div class="slds-m-bottom_medium slds-m-top_medium">
                            <div class="warning-icon-large-wrapper">
                                <lightning-icon icon-name="utility:warning" size="medium" class="warning-icon-custom">
                                </lightning-icon>
                            </div>
                        </div>

                        <h2 class="slds-text-heading_medium slds-m-bottom_medium header-title-centered">Confirm Update
                        </h2>

                        <p class="modal-text slds-m-bottom_large">
                            Are you sure you want to update the account details<br/>
                            with the verified PAN details?
                        </p>

                        <hr class="custom-hr" />
                    </div>

                    <footer class="slds-modal__footer custom-footer-right custom-rounded-bottom">
                        <button class="slds-button slds-button_neutral custom-btn" onclick={closeAllModals}>Cancel</button>
                        <button class="slds-button slds-button_brand custom-btn" onclick={handleConfirmUpdate}>Yes, Update</button>
                    </footer>
                </div>
            </section>

            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>

        <!-- 3. APPROVAL CONFIRMATION -->
        <template if:true={showApprovalModal}>
            <section
                role="dialog"
                tabindex="-1"
                aria-modal="true"
                aria-labelledby="pan-approval-heading"
                class="slds-modal slds-fade-in-open">

                <div class="slds-modal__container custom-modal-width">
                    <header class="slds-modal__header custom-header-left">
                        <button
                            class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                            title="Close"
                            onclick={closeAllModals}>
                            <lightning-icon
                                icon-name="utility:close"
                                alternative-text="Close"
                                variant="inverse"
                                size="small">
                            </lightning-icon>
                        </button>

                        <div class="header-content">
                            <lightning-icon
                                icon-name="utility:warning"
                                size="small"
                                class="warning-icon-header">
                            </lightning-icon>

                            <h2
                                id="pan-approval-heading"
                                class="slds-text-heading_medium header-title">
                                Approval Required
                            </h2>
                        </div>
                    </header>

                    <div class="slds-modal__content slds-p-around_large slds-theme_default">
                        <p class="modal-text slds-m-bottom_medium">
                            Are you sure you want to submit the verified PAN changes for approval?
                        </p>

                        <div class="info-alert-box slds-m-bottom_medium">
                            <lightning-icon
                                icon-name="utility:info"
                                size="small"
                                class="info-icon-custom">
                            </lightning-icon>

                            <p>
                                This PAN verification cannot be updated directly.
                                The Account details and verification status will remain
                                unchanged until the approval request is approved.
                            </p>
                        </div>

                        <hr class="custom-hr" />
                    </div>

                    <footer class="slds-modal__footer custom-footer-right">
                        <button
                            class="slds-button slds-button_neutral custom-btn"
                            onclick={closeAllModals}>
                            Cancel
                        </button>

                        <button
                            class="slds-button slds-button_brand custom-btn"
                            onclick={handleSendForApproval}>
                            Send for Approval
                        </button>
                    </footer>
                </div>
            </section>

            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>

        <!-- 4. APPROVAL SUBMITTED -->
        <template if:true={showApprovalSubmittedModal}>
            <section
                role="dialog"
                tabindex="-1"
                aria-modal="true"
                aria-labelledby="pan-approval-submitted-heading"
                class="slds-modal slds-fade-in-open">

                <div class="slds-modal__container custom-modal-width">
                    <header class="slds-modal__header custom-header-left">
                        <div class="header-content">
                            <lightning-icon
                                icon-name="utility:success"
                                size="small"
                                class="success-icon-header">
                            </lightning-icon>

                            <h2
                                id="pan-approval-submitted-heading"
                                class="slds-text-heading_medium header-title">
                                Approval Submitted
                            </h2>
                        </div>
                    </header>

                    <div class="slds-modal__content slds-p-around_large slds-theme_default">
                        <div class="success-alert-box">
                            <lightning-icon
                                icon-name="utility:info"
                                size="small"
                                class="success-icon-header">
                            </lightning-icon>

                            <p>
                                The PAN changes have been submitted for approval.
                                The Account will be updated only after the approval is completed.
                            </p>
                        </div>
                    </div>

                    <footer class="slds-modal__footer custom-footer-right">
                        <button
                            class="slds-button slds-button_brand custom-btn"
                            onclick={closeAllModals}>
                            Close
                        </button>
                    </footer>
                </div>
            </section>

            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>

                <!-- 4. Exact Match Success Modal -->
        <template if:true={showSuccessModal}>
            <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container custom-modal-width">
                    <div class="slds-modal__content custom-success-box">

                        <button
                            class="slds-button slds-button_icon custom-corner-close success-close-color"
                            title="Close"
                            onclick={closeAllModals}>
                            <lightning-icon icon-name="utility:close" size="small"></lightning-icon>
                            <span class="slds-assistive-text">Close</span>
                        </button>

                        <div class="success-body">
                            <div class="success-icon-container">
                                <lightning-icon icon-name="utility:check" size="medium" variant="inverse">
                                </lightning-icon>
                            </div>

                            <div class="success-text-content">
                                <h2 class="success-heading">PAN Updated Successfully</h2>
                                <p class="success-desc">
                                    The PAN details have been verified against the customer's name,
                                    date of birth and gender, and the PAN has been successfully
                                    updated in the customer account.
                                </p>
                            </div>
                        </div>

                        <div class="success-footer-divider"></div>

                        <div class="success-action">
                            <button class="btn-success-close" onclick={closeAllModals}>Close</button>
                        </div>

                    </div>
                </div>
            </section>

            <div class="slds-backdrop slds-backdrop_open slds-backdrop_light"></div>
        </template>

    </lightning-card>
</template>
