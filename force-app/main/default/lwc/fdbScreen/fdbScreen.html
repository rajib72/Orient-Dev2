<template>
    <div class={shellClass}>

        <!-- HEADER -->
        <div class="oj-head">
            <template if:true={showNav}>
                <button class="oj-head__btn oj-head__btn_left" type="button" onclick={handleNav}>
                    <template if:true={isHomeIcon}>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
                             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M4 10.4L12 4l8 6.4V19a1.4 1.4 0 0 1-1.4 1.4H5.4A1.4 1.4 0 0 1 4 19v-8.6z"></path>
                            <path d="M9.6 20.4v-6h4.8v6"></path>
                        </svg>
                    </template>
                    <template if:false={isHomeIcon}>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M15 5l-7 7 7 7"></path>
                        </svg>
                    </template>
                    <span>{navLabel}</span>
                </button>
            </template>

            <img src={brandLogoUrl} alt="Orient Jewellers" class="oj-head__logo" />

            <button class="oj-head__btn oj-head__btn_right" type="button" onclick={handleHelp}>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="9"></circle>
                    <path d="M9.6 9.4a2.5 2.5 0 1 1 3.3 2.4c-.6.2-.9.7-.9 1.3v.4"></path>
                    <path d="M12 16.6h.01"></path>
                </svg>
                <span>Help</span>
            </button>
        </div>

        <!-- BODY -->
        <slot></slot>

        <!-- BASE BAND -->
        <div class="oj-base">
            <span class="oj-base__dip"></span>
            <svg class="oj-base__orn" viewBox="0 0 44 22" aria-hidden="true">
                <path d="M22 1c4 6 4 13 0 19-4-6-4-13 0-19z"></path>
                <path d="M22 20c-6-2-11-7-13-13 6 1 11 6 13 13z" opacity=".85"></path>
                <path d="M22 20c6-2 11-7 13-13-6 1-11 6-13 13z" opacity=".85"></path>
            </svg>
        </div>
    </div>
</template>
