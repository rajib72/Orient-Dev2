<template>
    <div class="launcherButtonContainer">

        <lightning-button
            label={buttonLabel}
            title={buttonLabel}
            variant="brand"
            icon-name="utility:add"
            onclick={openModal}>
        </lightning-button>
    </div>

    <template if:true={isModalOpen}>

        <section
            role="dialog"
            tabindex="-1"
            aria-modal="true"
            aria-label="Create Activity"
            class="slds-modal slds-fade-in-open customModal"
            onkeydown={handleKeyDown}>

            <div class="slds-modal__container customModalContainer">

                <button
                    class="slds-button
                           slds-button_icon
                           slds-modal__close
                           slds-button_icon-inverse"
                    title="Close"
                    onclick={closeModal}>

                    <lightning-icon
                        icon-name="utility:close"
                        alternative-text="Close"
                        variant="inverse"
                        size="small">
                    </lightning-icon>

                    <span class="slds-assistive-text">
                        Close
                    </span>
                </button>

                <div class="customModalBody">

                    <c-lwc_create-form-activity-_-V2
                        record-id={recordId}
                        onactivitycancel={handleActivityCancel}
                        onactivitycreated={handleActivityCreated}>
                    </c-lwc_create-form-activity-_-V2>

                </div>
            </div>
        </section>

        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
