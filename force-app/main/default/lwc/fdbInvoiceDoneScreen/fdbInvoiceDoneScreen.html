<template>
    <c-fdb-screen nav-label="Home" nav-icon="home" onnavclick={handleNav} onhelpclick={handleHelp}>
            <!-- CONTENT -->
            <div class="ojp__body ojd__body">

                <!-- Two groups so landscape can set them side by side. In
                     portrait both are display:contents and nothing moves. -->
                <div class="oj-col oj-col_lead">

                <!-- SUCCESS -->
                <div class="ojd__hero">
                    <span class="ojd__tick">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
                             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M6 12.4l4 4 8-8.4"></path>
                        </svg>
                    </span>

                    <h1 class="ojd__title">Invoice Request Sent Successfully!</h1>

                    <div class="oj-orn oj-orn_sm">
                        <span class="oj-orn__line"></span>
                        <span class="oj-orn__diamond"></span>
                        <span class="oj-orn__line"></span>
                    </div>

                    <p class="ojd__text">
                        Your invoice copy is on its way to &nbsp;
                        <strong>{email}</strong>.
                    </p>
                </div>

                <p class="ojd__prompt">What would you like to do next?</p>

                </div><!-- /oj-col_lead -->

                <div class="oj-col oj-col_act">

                <!-- ACTIONS -->
                <button class="ojd__action ojd__action_primary" type="button" onclick={handleClose}>
                    <span class="ojd__action-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
                             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M14.6 4.4h3.8A1.6 1.6 0 0 1 20 6v12a1.6 1.6 0 0 1-1.6 1.6h-3.8"></path>
                            <path d="M9.6 15.6L14 12 9.6 8.4"></path>
                            <path d="M14 12H4"></path>
                        </svg>
                    </span>
                    <span class="ojd__action-text">
                        <strong>Done, Close This Session</strong>
                        <span>Hand the tablet back to our showroom team.</span>
                    </span>
                    <svg class="ojd__action-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M9 5l7 7-7 7"></path>
                    </svg>
                </button>

                </div><!-- /oj-col_act -->

                <!-- FOOTER -->
                <div class="oj-footer">
                    <div class="oj-footer__row">
                        <span class="oj-footer__lock">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <rect x="4.5" y="10" width="15" height="10.5" rx="2.2"></rect>
                                <path d="M8.2 10V7.2a3.8 3.8 0 0 1 7.6 0V10"></path>
                            </svg>
                        </span>
                        <p>Invoices are sent only to the verified email address above.<br />We never share your details with anyone.</p>
                    </div>
                    <div class="oj-orn oj-orn_sm oj-orn_footer">
                        <span class="oj-orn__line"></span>
                        <span class="oj-orn__diamond"></span>
                        <span class="oj-orn__line"></span>
                    </div>
                </div>

            </div>
    </c-fdb-screen>
</template>
