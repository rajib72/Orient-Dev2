                                                                <lightning-icon
                                                                    icon-name="utility:check"
                                                                    size="xx-small">
                                                                </lightning-icon>
                                                            </template>
                                                        </span>
                                                    </template>

                                                    <div>
                                                        <span class="primary-value">
                                                            {assignment.displayName}
                                                        </span>
                                                        <span class="secondary-value">
                                                            {assignment.dateRecordNo}
                                                        </span>
                                                    </div>
                                                </div>
                                            </td>
                                            <td>{assignment.executiveName}</td>
                                            <td>{assignment.teamName}</td>
                                            <td>{assignment.storeName}</td>
                                            <td>{assignment.formattedTargetDate}</td>
                                            <td>{assignment.formattedActualDate}</td>
                                            <td>{assignment.location}</td>
                                            <td>{assignment.attendanceDisplay}</td>
                                            <td>
                                                <span class={assignment.statusClass}>
                                                    {assignment.displayStatus}
                                                </span>
                                            </td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>

                        <template if:true={isGroupPreview}>
                            <div class={teamSelectionNoteClass}>
                                <lightning-icon
                                    icon-name={teamSelectionNoteIcon}
                                    size="x-small">
                                </lightning-icon>
                                <div>
                                    <span class="selection-feedback-summary">
                                        {previewGroupSelectionSummary}
                                    </span>
                                    <span>{teamSelectionMessage}</span>
                                </div>
                            </div>
                        </template>
                    </template>

                    <template if:false={hasAssignedPersons}>
                        <div class="section-empty">
                            No assigned person information is available.
                        </div>
                    </template>
                </section>

                <section class="overview-section">
                    <div class="section-heading">
                        <lightning-icon
                            icon-name="utility:summary"
                            size="small">
                        </lightning-icon>
                        <span>Supporting Information</span>
                    </div>

                    <div class="supporting-grid">
                        <template for:each={supportingCards} for:item="card">
                            <div key={card.key} class="supporting-card">
                                <lightning-icon
                                    icon-name={card.icon}
                                    size="small">
                                </lightning-icon>
                                <div>
                                    <span class="supporting-value">
                                        {card.value}
                                    </span>
                                    <span class="supporting-label">
                                        {card.label}
                                    </span>
                                </div>
                            </div>
                        </template>
                    </div>
                </section>

                <div class="detail-toggle-panel">
                    <div>
                        <div class="detail-toggle-title">
                            Need every field and related record?
                        </div>
                        <div class="detail-toggle-subtitle">
                            Full details are loaded only when requested.
                        </div>
                    </div>

                    <lightning-button
                        label={detailButtonLabel}
                        icon-name={detailButtonIcon}
                        onclick={handleToggleFullDetails}>
                    </lightning-button>
                </div>

                <template if:true={showFullDetails}>
                    <div class="full-details-heading">
                        Complete Record Details
                    </div>

                    <template for:each={detailedSections} for:item="section">
                        <section key={section.key} class="detail-section">
                            <div class="section-heading heading-between">
                                <span>{section.title}</span>
                                <span class="record-count">
                                    {section.recordCount} record(s)
                                </span>
                            </div>

                            <template if:true={section.hasRecords}>
                                <template for:each={section.records} for:item="record">
                                    <article key={record.key} class="record-card">
                                        <div class="record-title">
                                            {record.title}
                                        </div>

                                        <div class="field-grid">
                                            <template
                                                for:each={record.fields}
                                                for:item="field">

                                                <div
                                                    key={field.key}
                                                    class={field.containerClass}>

                                                    <span class="field-label">
                                                        {field.label}
                                                    </span>

                                                    <template if:true={field.hasValue}>
                                                        <lightning-formatted-text
                                                            value={field.displayValue}>
                                                        </lightning-formatted-text>
                                                    </template>

                                                    <template if:false={field.hasValue}>
                                                        <span class="blank-value">—</span>
                                                    </template>
                                                </div>
                                            </template>
                                        </div>
                                    </article>
                                </template>
                            </template>

                            <template if:false={section.hasRecords}>
                                <div class="section-empty">
                                    No related information is available.
                                </div>
                            </template>
                        </section>
                    </template>

                    <section class="detail-section">
                        <div class="section-heading heading-between">
                            <span>Salesforce Files</span>
                            <span class="record-count">
                                {detailedFileCount} file(s)
                            </span>
                        </div>

                        <template if:true={hasDetailedFiles}>
                            <div class="file-list">
                                <template for:each={detailedFiles} for:item="file">
                                    <a
                                        key={file.key}
                                        href={file.url}
                                        target="_blank"
                                        class="file-card">
                                        <lightning-icon
                                            icon-name="doctype:attachment"
                                            size="small">
                                        </lightning-icon>
                                        <div>
                                            <div class="file-title">
                                                {file.title}
                                            </div>
                                            <div class="file-meta">
                                                {file.fileType}
                                                &nbsp;•&nbsp;
                                                {file.formattedCreatedDate}
                                            </div>
                                        </div>
                                    </a>
                                </template>
                            </div>
                        </template>

                        <template if:false={hasDetailedFiles}>
                            <div class="section-empty">
                                No Salesforce File is attached.
                            </div>
                        </template>
                    </section>
                </template>

                <template if:true={canAct}>
                    <section class="action-section">
                        <lightning-textarea
                            label="Approval Comments / Rejection Reason"
                            value={actionComments}
                            placeholder="Optional for approval; mandatory for rejection."
                            maxlength="32768"
                            onchange={handleActionComments}>
                        </lightning-textarea>
                    </section>
                </template>

                <div class="preview-footer">
                    <lightning-button
                        label="Back to Workspace"
                        icon-name="utility:back"
                        onclick={handleBackFromPreview}>
                    </lightning-button>

                    <template if:true={showGroupRejectButton}>
                        <lightning-button
                            class="slds-m-left_small"
                            label={groupRejectLabel}
                            variant="destructive"
                            icon-name="utility:close"
                            disabled={isLoading}
                            onclick={handleRejectGroupSelection}>
                        </lightning-button>
                    </template>

                    <template if:true={showStandardRejectButton}>
                        <lightning-button
                            class="slds-m-left_small"
                            label="Reject"
                            variant="destructive"
                            icon-name="utility:close"
                            disabled={isLoading}
                            onclick={handleReject}>
                        </lightning-button>
                    </template>

                    <template if:true={showGroupApproveButton}>
                        <lightning-button
                            class="slds-m-left_small"
                            label={groupApproveLabel}
                            variant="brand"
                            icon-name="utility:check"
                            disabled={isLoading}
                            onclick={handleApproveGroupSelection}>
                        </lightning-button>
                    </template>

                    <template if:true={showStandardApproveButton}>
                        <lightning-button
                            class="slds-m-left_small"
                            label="Approve"
                            variant="brand"
                            icon-name="utility:check"
                            disabled={isLoading}
                            onclick={handleApprove}>
                        </lightning-button>
                    </template>
                </div>
            </template>
        </div>
    </lightning-card>
</template>
